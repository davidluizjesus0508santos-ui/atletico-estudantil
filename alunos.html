
<section class="panel" id="propostas-gremio">
  <h2>🏆 20 propostas do Atlético Estudantil</h2>
  <p>Conheça nossas ideias para melhorar a escola!</p>

  <div id="lista-gremio"></div>
</section>

<script>
const propostasGremio = [
  ["Feira de Profissões","Convidar profissionais para apresentar suas carreiras."],
  ["Clube de Estudos","Criar grupos de estudo para ajudar os alunos."],
  ["Desafio da Prova Paulista","Incentivar a aprendizagem e melhorar os resultados."],
  ["Torneio Esportivo","Organizar competições entre as turmas."],
  ["Escola Saudável","Promover limpeza e reciclagem na escola."],
  ["Caixa de Sugestões","Receber ideias dos estudantes."],
  ["Jornal do Grêmio","Divulgar notícias e projetos escolares."],
  ["Clube de Leitura","Incentivar a leitura entre os alunos."],
  ["Olimpíada de Conhecimentos","Realizar desafios de várias matérias."],
  ["Dia das Profissões","Apresentar diferentes carreiras aos estudantes."],
  ["Campeonato de Xadrez","Organizar partidas entre os alunos."],
  ["Desafio de Redação","Incentivar a escrita e a criatividade."],
  ["Clube de Tecnologia","Desenvolver projetos de programação e robótica."],
  ["Feira de Ciências","Expor pesquisas e experiências dos estudantes."],
  ["Campanha de Arrecadação","Promover ações solidárias com autorização da direção."],
  ["Intervalo com Jogos","Oferecer jogos educativos em atividades autorizadas."],
  ["Concurso de Fotografia","Expor fotos de temas escolhidos pelos estudantes."],
  ["Mural de Oportunidades","Divulgar cursos e olimpíadas estudantis."],
  ["Reconhecimento das Turmas","Valorizar colaboração, respeito e participação."],
  ["Reunião Aberta do Grêmio","Ouvir ideias e sugestões dos estudantes."]
];

const listaGremio = document.getElementById("lista-gremio");

propostasGremio.forEach((proposta, i) => {
  const item = document.createElement("article");
  item.className = "proposal";

  const titulo = document.createElement("h3");
  titulo.textContent = `${i + 1}. ${proposta[0]}`;

  const descricao = document.createElement("p");
  descricao.textContent = proposta[1];

  item.append(titulo, descricao);
  listaGremio.append(item);
});
</script>
