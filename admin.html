
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlético Estudantil | Administração</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #0b1220;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    main { max-width: 760px; margin: 30px auto; }
    section, article {
      background: #172238;
      padding: 20px;
      border-radius: 12px;
      margin: 16px 0;
      border: 1px solid #34435c;
    }
    input, button, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input, select {
      color: #111;
      background: #fff;
      border: 1px solid #aaa;
    }
    button {
      color: white;
      background: #2563eb;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    .erro { color: #ff9c9c; overflow-wrap: anywhere; }
    .sucesso { color: #86efac; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>🏆 Atlético Estudantil</h1>
  <p>Painel administrativo</p>

  <section id="login">
    <h2>Entrar</h2>
    <form id="formLogin">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username"
        placeholder="Digite seu e-mail" required>

      <label for="senha">Senha</label>
      <input id="senha" type="password"
        autocomplete="current-password"
        placeholder="Digite sua senha" required>

      <button id="entrar" type="submit">Entrar no painel</button>
    </form>
    <p id="msgLogin" role="status"></p>
  </section>

  <section id="painel" hidden>
    <h2>Propostas recebidas</h2>
    <p id="conta"></p>
    <button id="atualizar" type="button">Atualizar propostas</button>
    <p id="msgPainel" role="status"></p>
    <div id="lista"></div>
    <button id="sair" type="button">Sair</button>
  </section>
</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAm20hYu_9kWN8YwmkSPVoO5FVZwPRzysg",
  authDomain: "atletico-estudantil.firebaseapp.com",
  projectId: "atletico-estudantil",
  storageBucket: "atletico-estudantil.firebasestorage.app",
  messagingSenderId: "1059932469682",
  appId: "1:1059932469682:web:dadf2643c3b250903fccab",
  measurementId: "G-25XHNCC6H1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const el = id => document.getElementById(id);

function mostrar(id, texto, tipo = "") {
  el(id).textContent = texto;
  el(id).className = tipo;
}

function detalheErro(erro) {
  return (erro.code || "erro-desconhecido") + ": " +
    (erro.message || "Sem detalhes");
}

el("formLogin").addEventListener("submit", async evento => {
  evento.preventDefault();
  el("entrar").disabled = true;
  mostrar("msgLogin", "Verificando login...");

  try {
    await signInWithEmailAndPassword(
      auth,
      el("email").value.trim(),
      el("senha").value
    );
    mostrar("msgLogin", "Login realizado!", "sucesso");
  } catch (erro) {
    mostrar("msgLogin", "Falha no login: " + detalheErro(erro), "erro");
    console.error("Erro de login:", erro);
  } finally {
    el("entrar").disabled = false;
  }
});

onAuthStateChanged(auth, usuario => {
  el("login").hidden = !!usuario;
  el("painel").hidden = !usuario;

  if (usuario) {
    mostrar("conta", "Conectado: " + usuario.email);
    carregarPropostas();
  } else {
    el("lista").replaceChildren();
  }
});

async function carregarPropostas() {
  el("atualizar").disabled = true;
  el("lista").replaceChildren();
  mostrar("msgPainel", "Carregando propostas...");

  try {
    const consulta = query(
      collection(db, "propostas"),
      orderBy("criadaEm", "desc")
    );
    const resultado = await getDocs(consulta);

    if (resultado.empty) {
      mostrar("msgPainel", "Nenhuma proposta encontrada.", "sucesso");
      return;
    }

    mostrar("msgPainel", resultado.size + " proposta(s) encontrada(s).",
      "sucesso");

    resultado.forEach(registro => {
      const dados = registro.data();
      const caixa = document.createElement("article");

      const titulo = document.createElement("h3");
      titulo.textContent = dados.titulo || "Sem título";

      const categoria = document.createElement("p");
      categoria.textContent = "Categoria: " + (dados.categoria || "Não informada");

      const descricao = document.createElement("p");
      descricao.textContent = dados.descricao || "Sem descrição";

      const status = document.createElement("p");
      status.textContent = "Status: " + (dados.status || "pendente");

      const seletor = document.createElement("select");
      ["pendente", "em análise", "aprovada", "recusada"].forEach(valor => {
        const opcao = document.createElement("option");
        opcao.value = valor;
        opcao.textContent = valor;
        seletor.appendChild(opcao);
      });
      seletor.value = dados.status || "pendente";

      const salvar = document.createElement("button");
      salvar.textContent = "Salvar status";
      salvar.addEventListener("click", async () => {
        salvar.disabled = true;
        try {
          await updateDoc(doc(db, "propostas", registro.id), {
            status: seletor.value
          });
          status.textContent = "Status: " + seletor.value;
          mostrar("msgPainel", "Status atualizado!", "sucesso");
        } catch (erro) {
          mostrar("msgPainel", "Erro ao salvar: " + detalheErro(erro), "erro");
          console.error("Erro ao salvar:", erro);
        } finally {
          salvar.disabled = false;
        }
      });

      caixa.append(titulo, categoria, descricao, status, seletor, salvar);
      el("lista").appendChild(caixa);
    });
  } catch (erro) {
    mostrar("msgPainel", "Erro ao carregar propostas: " + detalheErro(erro), "erro");
    console.error("Erro ao carregar:", erro);
  } finally {
    el("atualizar").disabled = false;
  }
}

el("atualizar").addEventListener("click", carregarPropostas);

el("sair").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (erro) {
    mostrar("msgPainel", "Erro ao sair: " + detalheErro(erro), "erro");
  }
});
</script>
</body>
</html>
