
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | Atlético Estudantil</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
    }
    section, .proposta {
      background: #172238;
      border: 1px solid #34435c;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    input, button, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #52627a;
      font-size: 16px;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .mensagem { overflow-wrap: anywhere; }
    .erro { color: #ff9999; }
    .sucesso { color: #86efac; }
    .muted { color: #c1ccdd; }
  </style>
</head>
<body>
<main>
  <h1>🏆 Atlético Estudantil</h1>
  <p class="muted">Painel administrativo</p>

  <section id="login">
    <h2>Entrar</h2>
    <form id="formLogin">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username"
             placeholder="Seu e-mail" required>

      <label for="senha">Senha</label>
      <input id="senha" type="password"
             autocomplete="current-password"
             placeholder="Sua senha" required>

      <button id="botaoEntrar" type="submit">Entrar no painel</button>
    </form>
    <p id="msgLogin" class="mensagem" role="status"></p>
  </section>

  <section id="painel" hidden>
    <h2>Propostas recebidas</h2>
    <p id="usuarioLogado" class="muted"></p>
    <button id="botaoAtualizar" type="button">Atualizar propostas</button>
    <p id="msgPainel" class="mensagem" role="status"></p>
    <div id="lista"></div>
    <button id="botaoSair" type="button">Sair</button>
  </section>
</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  orderBy,
  query,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAm20hYu_9kWN8YwmkSPVoO5FVZwPRzysg",
  authDomain: "atletico-estudantil.firebaseapp.com",
  projectId: "atletico-estudantil",
  storageBucket: "atletico-estudantil.firebasestorage.app",
  messagingSenderId: "1059932469682",
  appId: "1:1059932469682:web:dadf2643c3b250903fccab",
  measurementId: "G-25XHNCC6H1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

function informar(id, texto, tipo = "") {
  $(id).textContent = texto;
  $(id).className = "mensagem " + tipo;
}

function mensagemErro(erro) {
  return `${erro.code || "sem-código"}: ${erro.message || "Erro desconhecido"}`;
}

$("formLogin").addEventListener("submit", async evento => {
  evento.preventDefault();
  const botao = $("botaoEntrar");
  botao.disabled = true;
  informar("msgLogin", "Verificando login...");

  try {
    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("senha").value
    );
    informar("msgLogin", "Login realizado!", "sucesso");
  } catch (erro) {
    informar("msgLogin", "Falha no login: " + mensagemErro(erro), "erro");
  } finally {
    botao.disabled = false;
  }
});

onAuthStateChanged(auth, async usuario => {
  $("login").hidden = !!usuario;
  $("painel").hidden = !usuario;

  if (usuario) {
    $("usuarioLogado").textContent =
      "Conectado como: " + usuario.email;
    await carregarPropostas();
  } else {
    $("lista").replaceChildren();
    informar("msgLogin", "");
  }
});

async function carregarPropostas() {
  informar("msgPainel", "Carregando propostas...");
  $("botaoAtualizar").disabled = true;
  $("lista").replaceChildren();

  try {
    const consulta = query(
      collection(db, "propostas"),
      orderBy("criadaEm", "desc")
    );
    const resultado = await getDocs(consulta);

    if (resultado.empty) {
      informar("msgPainel", "Nenhuma proposta encontrada.", "sucesso");
      return;
    }

    informar("msgPainel", resultado.size + " proposta(s) encontrada(s).",
      "sucesso");

    resultado.forEach(item => {
      const dados = item.data();
      const caixa = document.createElement("article");
      caixa.className = "proposta";

      const titulo = document.createElement("h3");
      titulo.textContent = dados.titulo || "Sem título";

      const categoria = document.createElement("p");
      categoria.textContent = "Categoria: " + (dados.categoria || "Não informada");

      const descricao = document.createElement("p");
      descricao.textContent = dados.descricao || "Sem descrição";

      const status = document.createElement("p");
      status.textContent = "Status atual: " + (dados.status || "pendente");

      const seletor = document.createElement("select");
      ["pendente", "em análise", "aprovada", "recusada"].forEach(opcao => {
        const itemOpcao = document.createElement("option");
        itemOpcao.value = opcao;
        itemOpcao.textContent = opcao;
        seletor.appendChild(itemOpcao);
      });
      seletor.value = dados.status || "pendente";

      const salvar = document.createElement("button");
      salvar.textContent = "Salvar status";
      salvar.addEventListener("click", async () => {
        salvar.disabled = true;
        try {
          await updateDoc(doc(db, "propostas", item.id), {
            status: seletor.value
          });
          status.textContent = "Status atual: " + seletor.value;
          informar("msgPainel", "Status atualizado!", "sucesso");
        } catch (erro) {
          informar("msgPainel", "Falha ao salvar: " + mensagemErro(erro), "erro");
        } finally {
          salvar.disabled = false;
        }
      });

      caixa.append(titulo, categoria, descricao, status, seletor, salvar);
      $("lista").appendChild(caixa);
    });
  } catch (erro) {
    informar("msgPainel",
      "Não foi possível carregar as propostas: " + mensagemErro(erro),
      "erro");
  } finally {
    $("botaoAtualizar").disabled = false;
  }
}

$("botaoAtualizar").addEventListener("click", carregarPropostas);

$("botaoSair").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (erro) {
    informar("msgPainel", "Erro ao sair: " + mensagemErro(erro), "erro");
  }
});
</script>
</body>
</html>
