
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração | Atlético Estudantil</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    header {
      padding: 26px 16px;
      text-align: center;
      background: #123b73;
      color: white;
    }

    main {
      width: min(950px, calc(100% - 24px));
      margin: 25px auto;
    }

    section {
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 3px 14px #152d5010;
    }

    h2 { color: #123b73; }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      margin-top: 5px;
      padding: 12px;
      border: 1px solid #bdc8d8;
      border-radius: 8px;
      font: inherit;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #123b73;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    .acoes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .cartao {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid #dce3ed;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    .cartao h3 { margin-top: 0; }

    .status {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 20px;
      background: #eaf2ff;
      color: #123b73;
      font-size: 13px;
    }

    #mensagem {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-top: 12px;
    }

    .erro { color: #a11919; }
    .sucesso { color: #146c43; }
    .oculto { display: none !important; }

    .aviso {
      color: #4b5563;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🏆 Atlético Estudantil</h1>
    <p>Painel de administração</p>
  </header>

  <main>
    <section id="login">
      <h2>Entrar</h2>
      <p>Use sua conta autorizada pela equipe responsável.</p>

      <form id="formLogin">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password"
          autocomplete="current-password" required>

        <div class="acoes">
          <button id="botaoLogin" type="submit">Entrar</button>
        </div>
      </form>
      <p class="aviso">
        Somente contas autorizadas devem ter acesso às propostas.
      </p>
    </section>

    <section id="painel" class="oculto">
      <h2>Propostas recebidas</h2>
      <p id="usuarioAtual"></p>

      <div class="acoes">
        <button id="atualizar" type="button">Atualizar propostas</button>
        <button id="sair" type="button">Sair</button>
      </div>

      <p class="aviso">
        As propostas são confidenciais. Compartilhe o acesso apenas
        com os responsáveis autorizados pela escola.
      </p>

      <div id="lista"></div>
    </section>

    <section>
      <p id="mensagem" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy,
      doc,
      updateDoc
    } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "COLE_A_API_KEY_REAL_DO_FIREBASE",
      authDomain: "atletico-estudantil.firebaseapp.com",
      projectId: "atletico-estudantil",
      storageBucket: "atletico-estudantil.firebasestorage.app",
      messagingSenderId: "1059932469682",
      appId: "1:1059932469682:web:dadf2643c3b250903fccab",
      measurementId: "G-25XHNCC6H1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const login = document.getElementById("login");
    const painel = document.getElementById("painel");
    const formLogin = document.getElementById("formLogin");
    const botaoLogin = document.getElementById("botaoLogin");
    const mensagem = document.getElementById("mensagem");
    const lista = document.getElementById("lista");

    function informar(texto, tipo = "") {
      mensagem.textContent = texto;
      mensagem.className = tipo;
    }

    function textoSeguro(tag, texto) {
      const elemento = document.createElement(tag);
      elemento.textContent = texto || "";
      return elemento;
    }

    formLogin.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      if (firebaseConfig.apiKey === apiKe") {
        informar("Configure a apiKey real do Firebase nos dois arquivos.", "erro");
        return;
      }

      botaoLogin.disabled = true;
      informar("Entrando...");

      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("senha").value
        );
      } 
catch (erro) {
  informar("Erro do Firebase: " + erro.code + " — " + erro.message, "erro");

      } finally {
        botaoLogin.disabled = false;
      }
    });

    onAuthStateChanged(auth, async (usuario) => {
      lista.replaceChildren();

      if (!usuario) {
        login.classList.remove("oculto");
        painel.classList.add("oculto");
        return;
      }

      login.classList.add("oculto");
      painel.classList.remove("oculto");
      document.getElementById("usuarioAtual").textContent =
        "Conta conectada: " + (usuario.email || "administrador");

      await carregarPropostas();
    });

    async function carregarPropostas() {
      lista.replaceChildren();
      informar("Carregando propostas...");

      try {
        const consulta = query(
          collection(db, "propostas"),
          orderBy("criadaEm", "desc")
        );
        const resultado = await getDocs(consulta);

        if (resultado.empty) {
          informar("Nenhuma proposta encontrada.");
          return;
        }

        resultado.forEach((registro) => {
          const dados = registro.data();
          const cartao = document.createElement("article");
          cartao.className = "cartao";

          cartao.append(
            textoSeguro("h3", dados.titulo),
            textoSeguro("p", "Categoria: " + (dados.categoria || "Não informada")),
            textoSeguro("p", dados.descricao),
            textoSeguro("p", "Status: " + (dados.status || "pendente"))
          );

          const seletor = document.createElement("select");
          seletor.setAttribute("aria-label", "Alterar status da proposta");
          [
            ["pendente", "Pendente"],
            ["em_analise", "Em análise"],
            ["aprovada", "Aprovada"],
            ["recusada", "Não aprovada"],
            ["concluida", "Concluída"]
          ].forEach(([valor, rotulo]) => {
            const opcao = document.createElement("option");
            opcao.value = valor;
            opcao.textContent = rotulo;
            seletor.append(opcao);
          });
          seletor.value = dados.status || "pendente";

          const salvar = document.createElement("button");
          salvar.type = "button";
          salvar.textContent = "Salvar status";

          salvar.addEventListener("click", async () => {
            salvar.disabled = true;
            try {
              await updateDoc(doc(db, "propostas", registro.id), {
                status: seletor.value
              });
              informar("Status atualizado.", "sucesso");
            } catch (erro) {
              informar("Não foi possível alterar. Confira as permissões do Firestore.", "erro");
            } finally {
              salvar.disabled = false;
            }
          });

          const acoes = document.createElement("div");
          acoes.className = "acoes";
          acoes.append(seletor, salvar);
          cartao.append(acoes);
          lista.append(cartao);
        });

        informar("Propostas carregadas: " + resultado.size, "sucesso");
      } catch (erro) {
        console.error(erro);
        informar(
          "Não foi possível carregar as propostas. O acesso pode estar bloqueado pelas regras do Firestore.",
          "erro"
        );
      }
    }

    document.getElementById("atualizar").addEventListener(
      "click", carregarPropostas
    );

    document.getElementById("sair").addEventListener("click", async () => {
      await signOut(auth);
      informar("Você saiu do painel.");
    });
  </script>
</body>
</html>
